[Water]
; 0 normal, 1 normals/waves, 2 fresnel, 3 SSR fade/foam, 4 water mask,
; 5 mirrored reflection source, 6 raw framebuffer source, 7 reflection mask,
; 8 pass id colors: surface cyan, reflection yellow, SSR magenta,
; 9 wave sources: wake red, swell green, edge waves blue.
DebugMode=0
; 0 fastest, 1 balanced, 2 full rough reflection sampling.
ReflectionQuality=1

; Main tuning knobs. 1.0 means the authored shader default.
SurfaceWave=1.14
RefractStrength=1.05
ReflectStrength=1.76
SSRStrength=1.16
GlintStrength=0.88
FoamStrength=0.82
ChromaStrength=0.55
TintStrength=0.74
CausticsStrength=0.95
DepthStrength=0.75
RippleStrength=0.85
RippleCenterX=0.50
RippleCenterY=0.38
SurfaceRelief=1.18
WakeStrength=1.55
WakeWidth=0.58
WakeLength=0.84
MicroRippleStrength=0.78
MicroRippleScale=0.95
MirrorRoughness=1.18
SwellStrength=1.18
SwellScale=0.82
WakeWaveStrength=1.65
EdgeWaveStrength=0.90
EdgeWaveWidth=0.085
RoughReflection=1.04
FresnelStrength=1.18
BottomCaustics=0.82
ContactEdge=0.72
DepthAbsorption=0.88
WallReflectionStretch=0.84
WaterSaturation=1.12
WaterBrightness=0.79
WaterTextureStrength=1.22
FlowWaterStrength=1.00
FlowReflectionStrength=1.08
FlowOpacity=1.03

; Lower values keep more of the original scene visible through the water.
Opacity=0.68

; Reflection controls. FramebufferReflection copies the current render target
; before the first tracked water draw and feeds it to all water shaders.
ForceReflection=0.95
SceneReflectionStrength=1.00
ReflectionContrast=1.42
FramebufferReflection=1

; Diagnostics for finding additional water shaders. Press Insert in-game to
; capture active draw/program info for a few seconds.
DiagnosticDumpShaders=1
DiagnosticFrames=150
DiagnosticMaxLines=420
