[Water]
; Core runtime switches. Keep GameShaderReplacement=0 for fast startup: the
; proxy tracks the game's water shaders and renders the synthetic pass lazily.
WaterShaderPatching=1
GameShaderReplacement=0
ShaderPreload=0
EffectToggleMask=4095

; Framebuffer capture and reflection source. Lower FramebufferScale only if GPU
; bandwidth becomes a problem; 1 keeps full-resolution refraction/reflection.
FramebufferReflection=1
ReflectionQuality=1
FramebufferCaptureInterval=1
FramebufferWarmupFrames=0
FramebufferScale=1

; Environment fog polish. The proxy patches only captured static lit
; room/environment shaders: no UI, no skinned actors, no alpha-test foliage,
; and no scrolling sTex0_wrap water/fx layers.
EnvironmentShaderPatching=1
EnvironmentFogStrength=1.08
EnvironmentFogAirlight=0.06

; Synthetic pass routing. Standing water is fully synthetic; flow water is
; texture-gated and blended with authored game layers.
SyntheticWaterSurface=1
SyntheticStandingWaterOnly=1
SyntheticFlowSurface=1
SyntheticCompileDelayFrames=240
SyntheticSurfaceOpacity=0.33
SyntheticSurfaceTint=0.28
SyntheticSurfaceReflection=0.00

; Standing water: body, refraction and reflections.
SurfaceWave=1.00
SurfaceVertexStrength=0.00
SurfaceVertexWaveStrength=0.00
SurfaceRelief=2.28
SafeVolumeStrength=0.38
PixelWaveStrength=1.58
RefractionWaveStrength=2.12
RefractStrength=1.42
