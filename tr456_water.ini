[Water]
; 0 normal, 1 normals/waves, 2 fresnel, 3 SSR fade/foam, 4 water mask,
; 5 mirrored reflection source, 6 raw framebuffer source, 7 reflection mask,
; 8 pass id colors: surface cyan, reflection yellow, SSR magenta,
; 9 surface: authored ripples red, shoreline green, volume blue.
;   flow: streak foam red, strands green, waves blue.
; 10 contact waves: height red, X slope green, Y slope blue.
DebugMode=0
; 0 fastest, 1 balanced, 2 full rough reflection sampling.
ReflectionQuality=1

; Main tuning knobs. 1.0 means the authored shader default.
SurfaceWave=1.12
SurfaceVertexStrength=0.46
SurfaceVertexWaveStrength=1.05
PixelWaveStrength=1.62
RefractionWaveStrength=1.52
DeepCausticsStrength=0.86
WaterVolumeStrength=1.18
ShorelineStrength=0.78
GameRippleStrength=1.45
RefractStrength=1.18
ReflectStrength=1.48
SSRStrength=1.00
GlintStrength=0.56
FoamStrength=0.54
ChromaStrength=0.36
TintStrength=0.74
CausticsStrength=0.46
DepthStrength=0.84
RippleStrength=0.62
RippleCenterX=0.50
RippleCenterY=0.38
SurfaceRelief=1.08
WakeStrength=0.95
WakeWidth=0.58
WakeLength=0.84
ContactWaveStrength=1.35
ContactWaveRadius=1.00
ContactWaveSpeed=1.34
ContactVertexStrength=0.30
ContactNormalStrength=1.35
ContactCoordMode=1
PatchRipplePass=1
RippleSpriteMinCount=96
MicroRippleStrength=0.36
MicroRippleScale=0.72
MirrorRoughness=1.02
SwellStrength=0.72
SwellScale=0.70
WakeWaveStrength=0.88
EdgeWaveStrength=0.42
EdgeWaveWidth=0.085
RoughReflection=0.90
FresnelStrength=1.05
BottomCaustics=0.82
ContactEdge=0.72
DepthAbsorption=1.08
WallReflectionStretch=0.84
WaterSaturation=1.02
WaterBrightness=0.82
