[Water]
; The proxy tracks original game water shaders, replaces old standing water
; when requested, and draws synthetic water through the tracked geometry.
WaterShaderPatching=1
ShaderPreload=0
; Auto picks a safe driver profile. Full requests all effects,
; ShaderOnly keeps game shaders/tracking but disables synthetic passes,
; Vanilla passes original rendering through.
CompatMode=Auto
CompatReport=1
CompatGlErrorCheck=1
CompatGlErrorWarmupDraws=60
CompatMaxSyntheticErrors=4
; Driver program binaries are skipped automatically on AMD/Mesa/RADV OpenGL.
ShaderBinaryCache=1
EffectToggleMask=2105
ReShadeChain=1
ReShadeDll=OpenGL32_reshade.dll

; Framebuffer capture used by synthetic refraction/reflection.
FramebufferReflection=1
ReflectionQuality=1
FramebufferCaptureInterval=1
FramebufferWarmupFrames=0
FramebufferScale=1

; Full-scene post pass: modular screen-space bump and contact SSGI.
ScenePost=1
SceneBumpStrength=0.42
SceneBumpScale=1.15
SceneSSGIStrength=0.55
SceneSSGIRadius=1.25
ScenePostDetail=0.00

; Synthetic pass routing. Standing water replaces the authored old surface so
; its blue film cannot wash out the synthetic pass. Flow water still blends over
; allowlisted authored layers, with a params fallback for repacked mods.
SyntheticWaterSurface=1
SyntheticStandingWaterOnly=1
SyntheticStandingReplaceOriginal=1
SyntheticFlowSurface=1
SyntheticReflectSurface=1
SyntheticCompileDelayFrames=0
SyntheticContactMaxSamples=192
SyntheticSurfaceOpacity=0.62
SyntheticSurfaceTint=0.44
SyntheticSurfaceReflection=0.76
WaterUnderlayPattern=0
WaterUnderlayPatternFlow=0
WaterUnderlayPatternStrength=0.00

