[Water]
; 0 = original game water. Set to 1 when we intentionally test our replacement shaders.
WaterShaderPatching=1
; 0 tracks original game water shaders and lets the synthetic layer render
; upgraded water without making the game compile our big replacement shaders
; during startup. 1 restores full game-shader source replacement.
GameShaderReplacement=0
EffectToggleMask=4095
; Debug modes: 0 normal, 14 draw id, 15 UV tiles, 17 authored texture,
; 18 world texture, 19 source alpha, 20 opaque final color, 21 seam guard.
; Runtime toggles: Ctrl+J+1..9,0,-,= isolate effect groups for testing.
DebugMode=0
ReflectionQuality=1
FramebufferReflection=1
FramebufferCaptureInterval=1
FramebufferWarmupFrames=0
FramebufferScale=1
; 0 lazy-load shader sources. 1 delayed background preload. 2 immediate preload.
ShaderPreload=1

; Safe geometry path. Flow water uses this for interior breathing while keeping
; triangle edges anchored to avoid authored tile seams.
ContactMeshSubdivision=0
ContactMeshStrength=0.92
WaterGridOverlay=0
WaterGridFlowOverlay=0
WaterGridSubdivision=4
WaterGridStrength=0.12
WaterGridOpacity=0.03
WaterGridFlowOpacity=0.03
SyntheticWaterSurface=1
SyntheticStandingWaterOnly=1
SyntheticFlowSurface=1
SyntheticFlowOnly=1
SyntheticCompileDelayFrames=240
